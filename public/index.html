<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120c06">
<title>नेपाल यातायात</title>
<meta name="description" content="A long bus ride through the hills, with music.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🚌</text></svg>">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="stylesheet" href="/assets/ride.css">
</head>
<body>

<!-- The road. Frames and video both live here; only one is ever lit. -->
<div id="stage" aria-hidden="true">
  <div id="frames"></div>
  <video id="bgvideo" muted playsinline loop preload="none"></video>
  <div id="grain"></div>
  <div id="vignette"></div>
</div>

<div id="tassels" aria-hidden="true">
  <div class="tassel-rail left"></div>
  <div class="tassel-rail right"></div>
</div>

<header id="signboard">
  <div class="plate">
    <span class="motif" aria-hidden="true">✿</span>
    <h1 id="sb-title"></h1>
    <span class="motif" aria-hidden="true">✿</span>
  </div>
  <p id="sb-subtitle"></p>
</header>

<!-- Parked in the viewport but invisible: YouTube stops audio on a hidden iframe. -->
<div id="yt-host" aria-hidden="true"><div id="yt-player"></div></div>

<button id="sound-hint" type="button" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l4 3V7L7 10zm12.5 2a3.5 3.5 0 00-2-3.16v6.32A3.5 3.5 0 0016.5 12z"/></svg>
  <span>ध्वनिका लागि क्लिक गर्नुहोस् · click anywhere for sound</span>
</button>

<footer id="dash">
  <div class="dash-inner">
    <div class="now">
      <span class="now-label">बज्दै छ</span>
      <span id="track" class="now-track">…</span>
    </div>

    <div class="transport">
      <button id="prev" type="button" title="Previous (←)" aria-label="Previous track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14L8 12zM6 5h2v14H6z"/></svg>
      </button>
      <button id="toggle" type="button" class="primary" title="Play / pause (space)" aria-label="Play or pause">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
      </button>
      <button id="next" type="button" title="Next (→)" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l10 7-10 7zM16 5h2v14h-2z"/></svg>
      </button>
      <button id="horn" type="button" class="horn" title="Horn (H)" aria-label="Sound the horn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h3l5 4V6L6 10zm12.5 2a3.5 3.5 0 00-2-3.16v6.32A3.5 3.5 0 0015.5 12zm-2 -7.4v2.06A5.5 5.5 0 0117.5 12a5.5 5.5 0 01-4 5.34v2.06A7.5 7.5 0 0019.5 12a7.5 7.5 0 01-6-7.4z"/></svg>
      </button>
    </div>

    <div class="knobs">
      <button id="shuffle" type="button" title="Shuffle (S)" aria-pressed="false" aria-label="Shuffle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l4 4-4 4V8h-2.5l-2 3-1.2-1.8L13.4 6H17zM3 6h4.6l7 10H17v-3l4 4-4 4v-3h-3.4l-7-10H3zm0 12h4.6l2-2.9 1.2 1.8-2.2 3.1H3z"/></svg>
      </button>
      <label class="vol" title="Volume">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l4 3V7L7 10z"/></svg>
        <input id="volume" type="range" min="0" max="100" step="1" aria-label="Volume">
      </label>
      <button id="fs" type="button" title="Fullscreen (F)" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 0h2v5h-5v-2h3z"/></svg>
      </button>
    </div>
  </div>
  <p id="marquee"></p>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/assets/ride.js" type="module"></script>
</body>
</html>
