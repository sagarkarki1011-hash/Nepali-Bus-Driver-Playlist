<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100d0b">
<title>नेपाल यातायात</title>
<meta name="description" content="राति भरि राजमार्गमा — नेपाली बस ड्राइभरको प्लेलिस्ट।">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🚌</text></svg>">

<!-- What Facebook, Instagram, WhatsApp and Messenger show when the link is
     shared. These have to be absolute URLs — a relative one gets no preview at
     all — so if the domain ever changes, every line below changes with it. -->
<link rel="canonical" href="https://nepalidriverdai.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nepalidriverdai.vercel.app/">
<meta property="og:site_name" content="नेपाल यातायात">
<meta property="og:locale" content="ne_NP">
<meta property="og:title" content="ड्राइभर दाइ · नेपाल यातायात">
<meta property="og:description" content="राति भरि राजमार्गमा — मोरङदेखि काठमाडौंसम्म, ड्राइभर दाइको प्लेलिस्ट बजिरहेको छ।">
<meta property="og:image" content="https://nepalidriverdai.vercel.app/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="नेपाली बसको केबिनबाट हिमाल र पहाडी बाटो।">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ड्राइभर दाइ · नेपाल यातायात">
<meta name="twitter:description" content="राति भरि राजमार्गमा — मोरङदेखि काठमाडौंसम्म।">
<meta name="twitter:image" content="https://nepalidriverdai.vercel.app/og.jpg">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="stylesheet" href="/assets/ride.css">
</head>
<body>

<!-- The road behind everything -->
<div id="stage" aria-hidden="true">
  <div id="bgblur"></div>
  <div id="frames"></div>
  <video id="bgvideo" class="bgv" muted playsinline preload="auto"></video>
  <video id="bgvideo2" class="bgv" muted playsinline preload="none"></video>
  <div id="grain"></div>
  <div id="scrim"></div>
  <div id="vignette"></div>
</div>

<div id="shell">

  <!-- ── header ─────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 16V6a2 2 0 012-2h12a2 2 0 012 2v10h1v2h-2v1a1 1 0 01-1 1h-1a1 1 0 01-1-1v-1H8v1a1 1 0 01-1 1H6a1 1 0 01-1-1v-1H3v-2zM6 7v4h5V7zm7 0v4h5V7zM7 13.2a1.3 1.3 0 100 2.6 1.3 1.3 0 000-2.6zm10 0a1.3 1.3 0 100 2.6 1.3 1.3 0 000-2.6z"/></svg>
      </span>
      <span class="brand-copy">
        <strong id="brand-title">नेपाल यातायात</strong>
        <span id="brand-route" class="route"></span>
      </span>
      <span class="plate" id="plate" title="गाडी नम्बर"></span>
    </div>

    <div class="status">
      <p class="clock"><span id="clock">--:--</span><span id="clock-sec" class="sec">--</span></p>
      <p class="aboard">
        <i class="dot" aria-hidden="true"></i>
        <strong id="aboard-n">१</strong>
        <span class="aboard-label">ABOARD</span>
      </p>
    </div>
  </header>

  <!-- ── middle ─────────────────────────────────────────────── -->
  <main class="hero">
    <!-- Grouped so it can be parked as one block above the fitted footage. -->
    <div class="hero-lede" id="hero-lede">
      <p class="eyebrow" id="eyebrow"><span id="date-bs"></span><span id="date-ad"></span></p>
      <h1 class="hero-title" id="hero-title">ड्राइभर दाइ</h1>
      <p class="hero-rule"><span id="hero-sub">राति भरि राजमार्गमा</span></p>
    </div>

    <div class="quote-wrap">
      <p class="quote" id="quote" aria-live="polite"></p>
      <button class="quote-refresh" id="quote-refresh" type="button" aria-label="अर्को उखान">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A8 8 0 106.3 17.7l1.42-1.42A6 6 0 1116.24 7.76L13.5 10.5H21V3l-2.6 2.6z"/></svg>
      </button>
    </div>
  </main>

  <!-- ── player ─────────────────────────────────────────────── -->
  <footer class="player">
    <button class="mascot" id="mascot" type="button" aria-label="हर्न बजाउनुहोस्">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path d="M11 16 L13.5 8 L18.5 14.5 Z" fill="#c8783e"/>
        <path d="M29 16 L26.5 8 L21.5 14.5 Z" fill="#c8783e"/>
        <circle cx="20" cy="23" r="11" fill="#d98a4a"/>
        <circle cx="16.2" cy="22.5" r="1.7" fill="#22190f"/>
        <circle cx="23.8" cy="22.5" r="1.7" fill="#22190f"/>
        <path d="M18 27.4q2 1.9 4 0" stroke="#22190f" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M10 15.5a10 6.5 0 0120 0z" fill="#3d5486"/>
        <rect x="7.5" y="15" width="25" height="3.4" rx="1.7" fill="#2a3a63"/>
      </svg>
    </button>

    <div class="player-grid">
      <div class="np">
        <span id="art" class="art" aria-hidden="true"></span>
        <span class="np-copy">
          <strong id="track" class="np-title">प्लेलिस्ट पर्खिँदै…</strong>
          <span id="artist" class="np-artist"></span>
        </span>
      </div>

      <div class="seek">
        <span id="t-cur" class="t">0:00</span>
        <input id="seek" class="seek-bar" type="range" min="0" max="1000" value="0" step="1"
               aria-label="गीतको स्थान">
        <span id="t-dur" class="t">0:00</span>
      </div>

      <div class="ctrls">
        <button id="prev" type="button" aria-label="अघिल्लो गीत">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14L8 12zM6 5h2v14H6z"/></svg>
        </button>
        <button id="toggle" type="button" class="play" aria-label="बजाउनुहोस् वा रोक्नुहोस्">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
        </button>
        <button id="next" type="button" aria-label="अर्को गीत">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l10 7-10 7zM16 5h2v14h-2z"/></svg>
        </button>

        <span class="ctrls-gap"></span>

        <button id="vol" type="button" aria-label="आवाजको मात्रा" aria-expanded="false" aria-controls="vol-pop">
          <svg class="i-loud" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4a1 1 0 001 1h2l4 4V5L6 9H4a1 1 0 00-1 1zm13.5 2a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4zM14 2.2v2.1a7.8 7.8 0 010 15.4v2.1a9.9 9.9 0 000-19.6z"/></svg>
          <svg class="i-mute" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4a1 1 0 001 1h2l4 4V5L6 9H4a1 1 0 00-1 1zm18.3-1.3-1.4-1.4L17 10.2l-2.9-2.9-1.4 1.4 2.9 2.9-2.9 2.9 1.4 1.4 2.9-2.9 2.9 2.9 1.4-1.4-2.9-2.9z"/></svg>
        </button>

        <div class="vol-pop" id="vol-pop" hidden>
          <button class="vol-mute" id="vol-mute" type="button" aria-label="आवाज बन्द वा चालु">
            <svg class="i-loud" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4a1 1 0 001 1h2l4 4V5L6 9H4a1 1 0 00-1 1zm13.5 2a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg>
            <svg class="i-mute" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4a1 1 0 001 1h2l4 4V5L6 9H4a1 1 0 00-1 1zm18.3-1.3-1.4-1.4L17 10.2l-2.9-2.9-1.4 1.4 2.9 2.9-2.9 2.9 1.4 1.4 2.9-2.9 2.9 2.9 1.4-1.4-2.9-2.9z"/></svg>
          </button>
          <input class="vol-range" id="vol-range" type="range" min="0" max="100" step="1" aria-label="आवाजको मात्रा">
          <output class="vol-out" id="vol-out">70</output>
        </div>

        <button id="queue" type="button" aria-label="गीत सूची" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h13v2H3zm0 5h13v2H3zm0 5h8v2H3z"/><path d="M14 12.6 21 16.6 14 20.6z"/></svg>
        </button>
        <button id="ticket" type="button" aria-label="यात्रु टिकट">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 012-2h14a2 2 0 012 2v2.2a2.8 2.8 0 000 5.6V17a2 2 0 01-2 2H5a2 2 0 01-2-2v-2.2a2.8 2.8 0 000-5.6zm6.5-.5v11h1.4v-11zm3.6 1.6v1.5h4.4V8.1zm0 3.2v1.5h4.4v-1.5z"/></svg>
        </button>
        <button id="fs" type="button" aria-label="पूरा स्क्रिन">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 0h2v5h-5v-2h3z"/></svg>
        </button>
      </div>
    </div>
  </footer>

</div>

<!-- Parked over the driver's shoulder by placePill(), on the footage itself. -->
<button class="pill" id="pill" type="button" hidden aria-label="हर्न बजाउनुहोस्">
  <span class="pill-badge" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M18.6 3.6a1 1 0 00-1.6-.8L9.5 8.1H5.2A2.2 2.2 0 003 10.3v3.4a2.2 2.2 0 002.2 2.2h.7l1.4 4.4a1 1 0 001 .7h1.5a1 1 0 001-1.3l-1.2-3.8h.9l7.5 5.3a1 1 0 001.6-.8z"/></svg>
  </span>
  <span class="pill-copy" id="pill-main">हर्न</span>
</button>

<!-- ── the playlist ─────────────────────────────────────────── -->
<div class="sheet" id="queue-sheet" hidden>
  <div class="sheet-back" id="queue-back"></div>
  <div class="queue" role="dialog" aria-modal="true" aria-labelledby="queue-heading">
    <header class="queue-top">
      <button class="queue-shuffle" id="shuffle" type="button" aria-pressed="false" aria-label="बेतरतिब बजाउनुहोस्">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l4 4-4 4V8h-2.5l-2 3-1.2-1.8L13.4 6H17zM3 6h4.6l7 10H17v-3l4 4-4 4v-3h-3.4l-7-10H3zm0 12h4.6l2-2.9 1.2 1.8-2.2 3.1H3z"/></svg>
      </button>
      <span class="queue-copy">
        <strong class="queue-heading" id="queue-heading">गीत सूची</strong>
        <span class="queue-count" id="queue-count">गनिँदै…</span>
      </span>
      <button class="queue-close" id="queue-close" type="button" aria-label="बन्द गर्नुहोस्">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg>
      </button>
    </header>

    <ol class="queue-list" id="queue-list"></ol>
    <p class="queue-note" id="queue-note" role="status"></p>
  </div>
</div>

<!-- ── passenger ticket ─────────────────────────────────────── -->
<div class="sheet" id="ticket-sheet" hidden>
  <div class="sheet-back" id="ticket-back"></div>
  <div class="ticket" role="dialog" aria-modal="true" aria-labelledby="ticket-heading">
    <button class="ticket-close" id="ticket-close" type="button" aria-label="बन्द गर्नुहोस्">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg>
    </button>

    <div class="ticket-top">
      <p class="ticket-kicker">यात्रु टिकट · PASSENGER TICKET</p>
      <h2 class="ticket-name" id="ticket-heading">नेपाल यातायात</h2>
      <p class="ticket-route" id="ticket-route"></p>
    </div>

    <div class="ticket-rip" aria-hidden="true"></div>

    <dl class="ticket-grid">
      <div><dt>गाडी नं · PLATE</dt><dd id="ticket-plate"></dd></div>
      <div><dt>सिट · SEAT</dt><dd id="ticket-seat"></dd></div>
      <div><dt>मिति · DATE</dt><dd id="ticket-date"></dd></div>
      <div><dt>भाडा · FARE</dt><dd id="ticket-fare"></dd></div>
    </dl>

    <p class="ticket-foot">शुभ यात्रा · भाडा तिरेर मात्र यात्रा गर्नुहोस्</p>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<!-- Kept in the viewport at zero opacity: YouTube stops audio on a hidden iframe. -->
<div id="yt-host" aria-hidden="true"><div id="yt-player"></div></div>

<script src="/assets/ride.js" type="module"></script>

<!-- Vercel Web Analytics. Served from this origin rather than a third party, so
     it needs no npm package and sets no cookies — the React component in the
     dashboard's instructions is for Next.js projects, not a static page like
     this one. Does nothing until Web Analytics is enabled for the project. -->
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
